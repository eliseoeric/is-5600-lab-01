<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Travel Explorer</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Browse</a></li>
      <li><a href="#">Destinations</a></li>
      <li><a href="#">Flights</a></li>
      <li><a href="#">Search</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>

  <!-- Hero Section with Large Image -->
  <section class="hero">
    <div class="hero-content">
      <h1>Now is the time to explore</h1>
      <p>Visit the land of your dreams</p>
      <a href="#" class="btn">Learn More</a>
    </div>
  </section>

  <!-- Cards Section -->
  <section class="cards">
    <div class="card">
      <img src="https://lp-cms-production.imgix.net/2023-09/shutterstockRF200702498.jpg?auto=format,compress&q=72&fit=crop" alt="India">
      <h2>Explore India</h2>
      <p>Experience spiritual journey.</p>
    </div>

    <div class="card">
      <img src="https://digital.ihg.com/is/image/ihg/intercontinental-chicago-5377570366-2x1" alt="Chicago">
      <h2>Discover Chicago</h2>
      <p>Experience city views.</p>
    </div>

    <div class="card">
      <img src="https://res.klook.com/image/upload/q_85/c_fill,w_750/v1674030135/blog/bnbtltnp5nqbdevfcbmn.jpg" alt="mountain">
      <h2>Visit </h2>
      <p>Enjoy view with cherry blossom.</p>
    </div>
  </section>

</body>
</html>
